<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LittleFalcon - Ovládání LED Pásku</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 30, 55, 0.6);
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --text-color: #f3f4f6;
            --text-dim: #9ca3af;
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.4);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.4);
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(17, 24, 39, 0.6) 0px, transparent 50%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            text-align: center;
            letter-spacing: -0.05em;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            max-width: 900px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-color);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(29, 78, 216, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .status-container {
            margin-top: 1rem;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-disconnected {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .badge-connected {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        /* LED Control Buttons */
        .led-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            justify-content: center;
            height: 100%;
        }

        .btn-led {
            border: none;
            border-radius: 12px;
            padding: 1.25rem;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn-led-on {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-led-on:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--success-glow);
        }

        .btn-led-on:active {
            transform: translateY(-1px);
        }

        .btn-led-off {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .btn-led-off:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--danger-glow);
        }

        .btn-led-off:active {
            transform: translateY(-1px);
        }

        .led-indicator {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: currentColor;
            display: inline-block;
            box-shadow: 0 0 8px currentColor;
        }

        /* Console log output */
        .console {
            grid-column: 1 / -1;
            background: rgba(10, 15, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            height: 180px;
            overflow-y: auto;
            color: #34d399;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.7);
        }

        .console-line {
            margin-bottom: 0.25rem;
            opacity: 0.85;
            line-height: 1.4;
        }
        
        .console-line.error {
            color: var(--danger);
        }
        
        .console-line.success {
            color: var(--success);
        }

        .console-line.warning {
            color: var(--warning);
        }
    </style>
</head>
<body>

    <h1>🚀 LittleFalcon</h1>
    <div class="subtitle">WiFi Ovládací Panel LED Pásku (Bez Ovladače)</div>

    <div class="dashboard">
        
        <!-- Connection Card -->
        <div class="card">
            <div>
                <div class="card-title">🔌 Připojení k Robotu</div>
                
                <div class="form-group">
                    <label for="robotIp">IP adresa robota (z hotspotu/seriálu)</label>
                    <input type="text" id="robotIp" placeholder="např. 192.168.137.123" value="192.168.137.">
                </div>

                <button class="btn" id="connectBtn">Připojit k Serveru</button>
            </div>

            <div class="status-container">
                <div class="status-item">
                    <span>Laptop Server WS:</span>
                    <span class="badge badge-disconnected" id="wsStatus">Odpojeno</span>
                </div>
                <div class="status-item">
                    <span>Stav LED Pásku:</span>
                    <span class="badge badge-disconnected" id="ledStatus">Vypnuto</span>
                </div>
            </div>
        </div>

        <!-- LED Control Card -->
        <div class="card">
            <div class="card-title">💡 Manuální Ovládání LED</div>
            
            <div class="led-actions">
                <button class="btn-led btn-led-on" id="ledOnBtn">
                    <span class="led-indicator"></span>
                    Zapnout LED
                </button>
                
                <button class="btn-led btn-led-off" id="ledOffBtn">
                    <span class="led-indicator"></span>
                    Vypnout LED
                </button>
            </div>
        </div>

        <!-- Realtime Console logs -->
        <div class="console" id="consoleBox">
            <div class="console-line success">Ovládací panel spuštěn. Zadejte IP adresu robota a klikněte na Připojit.</div>
        </div>

    </div>

    <script>
        const robotIpInput = document.getElementById('robotIp');
        const connectBtn = document.getElementById('connectBtn');
        const wsStatus = document.getElementById('wsStatus');
        const ledStatus = document.getElementById('ledStatus');
        const ledOnBtn = document.getElementById('ledOnBtn');
        const ledOffBtn = document.getElementById('ledOffBtn');
        const consoleBox = document.getElementById('consoleBox');

        let ws = null;
        let isWsConnected = false;
        let ledState = false; // Aktuální nastavený stav LED
        let heartbeatInterval = null;

        // Načtení předchozí uložené IP adresy
        const savedIp = localStorage.getItem('robotIp');
        if (savedIp) {
            robotIpInput.value = savedIp;
        }

        function logToConsole(text, type = '') {
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            consoleBox.appendChild(line);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        // Připojení WebSocketu k lokálnímu serveru
        function connectWebSocket() {
            const ip = robotIpInput.value.trim();
            if (!ip || ip === "192.168.137.") {
                logToConsole("Chyba: Zadejte platnou IP adresu robota!", "error");
                return;
            }
            localStorage.setItem('robotIp', ip);

            if (ws) {
                ws.close();
            }

            logToConsole(`Připojuji se k lokálnímu serveru ws://${window.location.hostname || 'localhost'}:3000...`);
            
            const wsUrl = `ws://${window.location.host || 'localhost:3000'}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                isWsConnected = true;
                wsStatus.textContent = "Připojeno";
                wsStatus.className = "badge badge-connected";
                logToConsole("Připojeno k lokálnímu Node.js serveru!", "success");
                
                // Odeslání IP adresy na server
                ws.send(JSON.stringify({ type: 'connect', ip: ip }));
                logToConsole(`Nastavena IP robota v serveru: ${ip}`, "success");

                // Spuštění periodických keep-alive heartbeatů (100 ms) pro zabránění safety timeoutu robota
                startHeartbeats();
            };

            ws.onclose = () => {
                isWsConnected = false;
                wsStatus.textContent = "Odpojeno";
                wsStatus.className = "badge badge-disconnected";
                logToConsole("Spojení s lokálním serverem ztraceno.", "error");
                stopHeartbeats();
            };

            ws.onerror = (err) => {
                logToConsole(`WebSocket chyba: ${err.message || 'Nelze se připojit'}`, "error");
            };
        }

        // Spuštění periodického odesílání stavu LED
        function startHeartbeats() {
            stopHeartbeats();
            logToConsole("Spouštím odesílání periodických keep-alive (heartbeat) paketů...", "warning");
            heartbeatInterval = setInterval(() => {
                sendLedCommand(ledState);
            }, 100); // 10 Hz pro spolehlivou odezvu
        }

        function stopHeartbeats() {
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
            }
        }

        // Odeslání příkazu LED přes WebSocket
        function sendLedCommand(state) {
            if (isWsConnected && ws) {
                ws.send(JSON.stringify({
                    type: 'led',
                    state: state
                }));
            }
        }

        // Akce tlačítek
        ledOnBtn.addEventListener('click', () => {
            ledState = true;
            ledStatus.textContent = "Zapnuto";
            ledStatus.className = "badge badge-connected";
            logToConsole("Příkaz: ZAPNOUT LED", "success");
            sendLedCommand(true);
        });

        ledOffBtn.addEventListener('click', () => {
            ledState = false;
            ledStatus.textContent = "Vypnuto";
            ledStatus.className = "badge badge-disconnected";
            logToConsole("Příkaz: VYPNOUT LED", "error");
            sendLedCommand(false);
        });

        connectBtn.addEventListener('click', connectWebSocket);
    </script>
</body>
</html>
